<div class="au">
  <section class="au-form">
    <h1 class="au-h">로그인</h1>
    <form onsubmit="return false">
      <label class="sc-field"><span>이메일</span><input type="email" placeholder="name@example.com" autocomplete="username"></label>
      <label class="sc-field"><span>비밀번호</span><input type="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password"></label>
      <div class="au-opts"><label><input type="checkbox"> 로그인 상태 유지</label><label><input type="checkbox"> 이메일 저장</label></div>
      <button class="sc-btn primary block">로그인</button>
      <div class="au-links"><button type="button" data-page="signup">회원가입</button><span>이메일 찾기</span><span>비밀번호 찾기</span></div>
    </form>
  </section>

  <aside class="au-side" aria-label="제품 여권 예시">
    <h2>제품 여권은 이렇게 쌓여요</h2>
    <p>구매부터 수리, 소유권 이전까지 한 장에 이어서 기록돼요.</p>
    <div class="au-pp">
      <div class="au-pp-h"><b>노트북 · 13인치</b><span>예시</span></div>
      <ol>
        <li><time>2023.03</time><span>구매 · 영수증 확인</span><em>구매</em></li>
        <li><time>2024.08</time><span>배터리 교체</span><em>수리</em></li>
        <li><time>2025.02</time><span>소유권 이전</span><em>이전</em></li>
      </ol>
      <div class="au-pp-f">개인정보는 가린 문서 사본만 보관해요.</div>
    </div>
  </aside>
</div>
