<div class="au">
  <section class="au-form">
    <h1 class="au-h">회원가입</h1>
    <form onsubmit="return false">
      <label class="sc-field"><span>이메일<em>*</em></span><input type="email" placeholder="name@example.com" autocomplete="username"></label>
      <label class="sc-field"><span>비밀번호<em>*</em></span><input type="password" placeholder="비밀번호를 입력하세요" autocomplete="new-password"></label>
      <div class="au-rules"><span>8자 이상</span><span>영문 포함</span><span>숫자 포함</span><span>특수문자 포함</span></div>
      <label class="sc-field"><span>비밀번호 확인<em>*</em></span><input type="password" placeholder="비밀번호를 다시 입력하세요" autocomplete="new-password"></label>
      <label class="sc-field"><span>닉네임<em>*</em></span><input placeholder="2~12자" maxlength="12"><small>거래 상대에게는 닉네임만 보여요.</small></label>
      <div class="au-agree">
        <label class="all"><input type="checkbox"> 전체 동의</label>
        <label><input type="checkbox"> 이용약관 동의 <em>(필수)</em></label>
        <label><input type="checkbox"> 개인정보 수집·이용 동의 <em>(필수)</em></label>
      </div>
      <button class="sc-btn primary block">가입하기</button>
      <div class="au-sub">이미 계정이 있나요?<button type="button" data-page="auth">로그인</button></div>
    </form>
  </section>

  <aside class="au-side" aria-label="가입 후 이용 순서">
    <h2>가입하면 이렇게 쓸 수 있어요</h2>
    <p>제품을 등록하는 것부터 다음 주인에게 넘기는 것까지 이어져요.</p>
    <ol class="au-steps">
      <li><b>1</b><div><strong>제품 등록</strong><span>구매 정보와 시리얼 번호를 한 번만 입력해요.</span></div></li>
      <li><b>2</b><div><strong>문서 보관</strong><span>영수증과 수리 내역은 개인정보를 가린 사본으로 보관해요.</span></div></li>
      <li><b>3</b><div><strong>거래 · 소유권 이전</strong><span>판매할 때 기록이 다음 주인에게 그대로 넘어가요.</span></div></li>
    </ol>
  </aside>
</div>
