spring:
  application:
    name: aibe7-final-project-team1
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  supabase:
    url: ${SUPABASE_URL:}
    secret: ${SUPABASE_SECRET:}
  features:
    trade-purchase-requests:
      enabled: false
    trade-p3:
      enabled: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    local-root: ${LOCAL_STORAGE_ROOT:./storage}
    signing-secret: ${STORAGE_SIGNING_SECRET:${app.jwt.secret}}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
