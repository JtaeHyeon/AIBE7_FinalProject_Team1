spring:
  application:
    name: aibe7-final-project-team1
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  forward-headers-strategy: framework

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
  storage:
    local-root: ${LOCAL_STORAGE_ROOT:./storage}

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"
