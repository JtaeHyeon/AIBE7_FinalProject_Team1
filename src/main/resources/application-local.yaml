spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aibe7}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:aibe7}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-jwt-secret-at-least-32-bytes}
  product:
    serial:
      fingerprint-secret: ${SERIAL_FINGERPRINT_SECRET:change-this-local-serial-secret-at-least-32-bytes}

logging:
  level:
    root: INFO
    org.example.springtestci: DEBUG
