spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:aibe7;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:create-drop}
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-local-jwt-secret-at-least-32-bytes}

logging:
  level:
    root: INFO
    org.example.springtestci: DEBUG
