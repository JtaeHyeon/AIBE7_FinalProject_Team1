spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/aibe7_test}
    username: ${TEST_DB_USERNAME:aibe7}
    password: ${TEST_DB_PASSWORD}
  data:
    redis:
      host: ${TEST_REDIS_HOST:localhost}
      port: ${TEST_REDIS_PORT:6379}
      password: ${TEST_REDIS_PASSWORD:}
  jpa:
    show-sql: false

app:
  features:
    listing-history:
      enabled: false
  ai:
    summary:
      enabled: false
  product:
    serial-secret: ${TEST_PRODUCT_SERIAL_SECRET:test-product-serial-secret-at-least-32-bytes}
  jwt:
    secret: ${TEST_JWT_SECRET}
  storage:
    local-root: ${TEST_STORAGE_ROOT:${java.io.tmpdir}/aibe7-test-storage}
