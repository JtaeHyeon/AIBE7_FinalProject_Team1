spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  product:
    serial:
      fingerprint-secret: ${SERIAL_FINGERPRINT_SECRET}

logging:
  level:
    root: INFO
    org.example.springtestci: INFO
