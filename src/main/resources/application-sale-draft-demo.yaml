spring:
  datasource:
    url: jdbc:h2:file:${java.io.tmpdir}/pastport-sale-draft-r01;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo/sale-draft
  jpa:
    hibernate:
      ddl-auto: validate

server:
  address: 127.0.0.1
  port: 18081

app:
  product:
    serial-secret: demo-product-serial-secret-at-least-32-bytes-long
  storage:
    local-root: ${java.io.tmpdir}/pastport-sale-draft-r01-images
