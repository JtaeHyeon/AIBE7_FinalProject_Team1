name: CI

# PR을 `main`에 합치기 전에 포맷 검사, 빌드, 테스트를 자동으로 실행한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에서 새 커밋이 올라오면 이전 실행은 취소한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 저장소 내용을 읽는 권한만 사용한다.
permissions:
  contents: read

jobs:
  build:
    name: Format, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 의존성과 빌드 캐시를 실행 사이에 재사용한다.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck --console=plain

      # spotlessCheck는 위에서 이미 실행했으므로 제외한다. `build`에는 테스트가 포함된다.
      - name: Build and test
        run: ./gradlew build -x spotlessCheck --console=plain

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

# 참고: 현재 테스트는 H2(메모리 DB)로 실행되며 별도 환경 변수가 필요 없다.
# 실제 PostgreSQL로 검증하는 작업을 추가할 때는 `services:`에 postgres:17-alpine, redis:8-alpine을
# 올리고 필요한 환경 변수(`SALE_DRAFT_TEST_DB_URL` 등)를 지정한다.
